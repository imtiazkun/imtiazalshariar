<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>{{ if .Title }}{{ .Title }} - {{ .Site.Title }}{{ else }}{{ .Site.Title }}{{ end }}</title>
    <meta name="title" content="{{ if .Title }}{{ .Title }} - {{ .Site.Title }}{{ else }}{{ .Site.Title }}{{ end }}">
    <meta name="description"
        content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    {{ if .Params.keywords }}
    <meta name="keywords"
        content="{{ range $i, $keyword := .Params.keywords }}{{ if $i }}, {{ end }}{{ $keyword }}{{ end }}">{{ end }}
    <meta name="author" content="{{ .Site.Params.author }}">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="language" content="{{ .Site.LanguageCode }}">
    <meta name="revisit-after" content="7 days">

    <!-- Canonical URL -->
    <link rel="canonical" href="{{ .Permalink }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type"
        content="{{ if .Params.og.type }}{{ .Params.og.type }}{{ else }}{{ .Site.Params.og.type }}{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:title"
        content="{{ if .Title }}{{ .Title }} - {{ .Site.Title }}{{ else }}{{ .Site.Title }}{{ end }}">
    <meta property="og:description"
        content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:image"
        content="{{ if .Params.og.image }}{{ .Params.og.image | absURL }}{{ else }}{{ .Site.Params.og.image | absURL }}{{ end }}">
    <meta property="og:image:alt"
        content="{{ if .Params.og.imageAlt }}{{ .Params.og.imageAlt }}{{ else }}{{ .Site.Params.og.imageAlt }}{{ end }}">
    <meta property="og:site_name" content="{{ .Site.Title }}">
    <meta property="og:locale" content="{{ .Site.LanguageCode }}">

    <!-- Twitter -->
    <meta property="twitter:card" content="{{ .Site.Params.twitter.card }}">
    <meta property="twitter:url" content="{{ .Permalink }}">
    <meta property="twitter:title"
        content="{{ if .Title }}{{ .Title }} - {{ .Site.Title }}{{ else }}{{ .Site.Title }}{{ end }}">
    <meta property="twitter:description"
        content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="twitter:image"
        content="{{ if .Params.og.image }}{{ .Params.og.image | absURL }}{{ else }}{{ .Site.Params.og.image | absURL }}{{ end }}">
    <meta property="twitter:image:alt"
        content="{{ if .Params.og.imageAlt }}{{ .Params.og.imageAlt }}{{ else }}{{ .Site.Params.og.imageAlt }}{{ end }}">
    <meta property="twitter:site" content="{{ .Site.Params.twitter.site }}">
    <meta property="twitter:creator" content="{{ .Site.Params.twitter.creator }}">

    <!-- Additional SEO Meta Tags -->
    <meta name="theme-color" content="#2c3e50">
    <meta name="msapplication-TileColor" content="#2c3e50">
    <meta name="application-name" content="{{ .Site.Title }}">

    <!-- Google Site Verification -->
    {{ if .Site.Params.seo.googleSiteVerification }}
    <meta name="google-site-verification" content="{{ .Site.Params.seo.googleSiteVerification }}">
    {{ end }}

    <!-- Bing Site Verification -->
    {{ if .Site.Params.seo.bingSiteVerification }}
    <meta name="msvalidate.01" content="{{ .Site.Params.seo.bingSiteVerification }}">
    {{ end }}

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "{{ .Site.Params.author }}",
      "url": "{{ .Site.BaseURL }}",
      "description": "{{ .Site.Params.description }}",
      "jobTitle": "Design-forward Product Engineer",
      "worksFor": {
        "@type": "Organization",
        "name": "Freelance"
      },
      "sameAs": [
        {{ if .Site.Params.github }}"https://github.com/{{ .Site.Params.github }}",{{ end }}
        {{ if .Site.Params.linkedin }}"https://linkedin.com/in/{{ .Site.Params.linkedin }}",{{ end }}
        {{ if .Site.Params.twitter }}"https://twitter.com/{{ .Site.Params.twitter }}",{{ end }}
        "{{ .Site.BaseURL }}"
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        h1 {
            font-family: 'EB Garamond', serif;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 1rem;
        }

        h2 {
            font-family: 'EB Garamond', serif;
            font-weight: 600;
            color: #34495e;
            margin: 2rem 0 1rem 0;
        }

        p {
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="flex items-center justify-between py-4 px-6 bg-white border-b border-gray-200">
        <!-- Left side: Logo and Navigation links -->
        <div class="hidden md:flex items-center space-x-8">
            <span class="text-xl font-semibold text-gray-900">Im.</span>
            <a href="#" class="text-sm text-gray-700 hover:text-gray-900 transition-colors">Projects</a>
            <a href="#" class="text-sm text-gray-700 hover:text-gray-900 transition-colors">Case Study</a>
            <a href="#" class="text-sm text-gray-700 hover:text-gray-900 transition-colors">Gallery</a>
        </div>

        <!-- Mobile logo (visible when menu is hidden) -->
        <div class="md:hidden">
            <span class="text-xl font-semibold text-gray-900">Im.</span>
        </div>

        <!-- Right side: Action buttons -->
        <div class="flex items-center space-x-4">
            <button
                class="px-4 py-2 text-sm text-gray-700 hover:text-gray-900 transition-colors rounded-full">Subscribe</button>
            <button
                class="px-4 py-2 text-sm bg-gray-900 text-white rounded-full hover:bg-gray-800 transition-colors">Consult</button>
        </div>
    </nav>

    <!-- Main content -->
    <div class="max-w-4xl mx-auto px-6 py-8">
        <h1>{{ .Title }}</h1>
        {{ .Content }}
    </div>
</body>

</html>
